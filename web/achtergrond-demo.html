<!DOCTYPE html>
<!-- Demo-pagina voor achtergrond.js — toont stippenraster + mock pose zonder
     dat Hailo op de Pi hoeft te draaien. Open in browser met ?demo=1.
     Voor écht live beeld van de camera: open face/index.html die achtergrond.js
     via websocket laadt. -->
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Anna — achtergrond demo</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #140306; color: #fff5ea; font-family: sans-serif; overflow: hidden; }
    #achtergrond { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; }
    .cel-mock {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none;
      text-shadow: 0 2px 20px rgba(0,0,0,0.95), 0 0 32px rgba(0,0,0,0.85);
    }
    .cel-mock .hint {
      font-family: Georgia, serif; font-style: italic;
      font-size: 6vmin; opacity: 0.8;
    }
    .label-corner {
      position: fixed; top: 1.2vmin; left: 1.2vmin; z-index: 3;
      font-family: ui-monospace, Menlo, monospace; font-size: 2vmin;
      color: rgba(255,255,255,0.45); background: rgba(0,0,0,0.6);
      padding: 0.6vmin 1vmin; border-radius: 4px;
    }
    .state-picker {
      position: fixed; bottom: 2vmin; left: 50%; transform: translateX(-50%);
      z-index: 4; display: flex; gap: 1vmin; font-family: ui-monospace, monospace;
    }
    .state-picker button {
      background: rgba(0,0,0,0.6); color: #fff5ea;
      border: 1px solid rgba(255,245,234,0.3); padding: 1vmin 1.5vmin;
      font-family: inherit; font-size: 1.6vmin; cursor: pointer; border-radius: 4px;
    }
    .state-picker button:hover { border-color: rgba(255,245,234,0.8); }
    .state-picker button.actief { background: rgba(244,184,96,0.3); border-color: #f4b860; }
  </style>
</head>
<body class="state-sluimert">
  <canvas id="achtergrond"></canvas>
  <div class="cel-mock">
    <div class="hint" id="hint">zeg "hoi anna nova"</div>
  </div>
  <div class="label-corner">DEMO · stippen + stippen-keypoints · klik een state ↓</div>
  <div class="state-picker">
    <button data-state="sluimert" data-hint='zeg "hoi anna nova"'>sluimert</button>
    <button data-state="luistert" data-hint='ik luister…'>luistert</button>
    <button data-state="denkt"    data-hint='ik denk…'>denkt</button>
    <button data-state="spreekt"  data-hint='ik vertel…'>spreekt</button>
  </div>
  <script src="achtergrond.js?demo=1"></script>
  <script>
    // Force demo-modus
    if (!location.search.includes("demo")) {
      history.replaceState(null, "", location.pathname + "?demo=1");
      location.reload();
    }
    // State-picker: wissel body.className zodat achtergrond.js kleur/puls wisselt
    const knoppen = document.querySelectorAll(".state-picker button");
    function setActive(btn) {
      knoppen.forEach(b => b.classList.toggle("actief", b === btn));
      document.body.className = "state-" + btn.dataset.state;
      document.getElementById("hint").textContent = btn.dataset.hint;
    }
    knoppen.forEach(b => b.addEventListener("click", () => setActive(b)));
    setActive(document.querySelector('[data-state="sluimert"]'));
  </script>
</body>
</html>
