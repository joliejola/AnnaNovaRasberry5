<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anna Nova</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      cursor: none;
    }

    /* Vierkant canvas voor Waveshare 4" (720×720). Op grotere schermen
       centreren we en houden we 1:1. Op het Pi-scherm zelf vult hij 't scherm. */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .square {
      position: relative;
      width: 100vmin;
      height: 100vmin;
      overflow: hidden;
      background: #000;
    }

    /* Camerabeeld — vol, blurred, iets donkerder zodat tekst leesbaar is */
    #cam {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(16px) brightness(0.55) saturate(0.9);
      transform: scale(1.08);  /* iets opgeblazen zodat blur-rand niet zichtbaar is */
      transition: filter 1s ease, opacity 0.6s ease;
    }
    #cam.absent {
      opacity: 0.4;
    }

    /* Overlay waar tekst op komt */
    .overlay {
      position: absolute;
      inset: 0;
      padding: 6vmin;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
      text-shadow: 0 2px 12px rgba(0,0,0,0.75);
    }

    /* Bovenin: wie er praat / staat (klein, bijna-fluistering) */
    .top {
      font-size: 2.4vmin;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      opacity: 0.55;
      font-weight: 300;
    }

    /* Midden: laatste zin, groot. Jouw zin + Anna's antwoord onder elkaar. */
    .conversation {
      display: flex;
      flex-direction: column;
      gap: 2.5vmin;
      align-items: flex-start;
      max-width: 90%;
    }
    .line {
      line-height: 1.3;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .line.visible { opacity: 1; transform: translateY(0); }
    .line .who {
      display: block;
      font-size: 2vmin;
      letter-spacing: 0.14em;
      text-transform: lowercase;
      opacity: 0.55;
      margin-bottom: 0.8vmin;
      font-weight: 300;
    }
    .line .text {
      display: block;
      font-size: 4.4vmin;
      font-weight: 400;
      line-height: 1.35;
    }
    .line.anna .who   { color: #f4b860; opacity: 0.75; }
    .line.anna .text  { color: #faf3ea; font-style: italic; }
    .line.visitor .who  { color: rgba(255,255,255,0.6); }
    .line.visitor .text { color: #fff; font-weight: 300; }

    /* Denken: drie puntjes die één voor één oplichten */
    .thinking {
      display: none;
      align-items: center;
      gap: 2vmin;
      font-size: 2.4vmin;
      letter-spacing: 0.2em;
      text-transform: lowercase;
      opacity: 0.75;
      color: #f4b860;
    }
    .thinking.on { display: flex; }
    .thinking .dots { display: inline-flex; gap: 1.2vmin; }
    .thinking .dots i {
      width: 1.4vmin; height: 1.4vmin;
      border-radius: 50%;
      background: #f4b860;
      opacity: 0.25;
      animation: dot 1.4s ease-in-out infinite;
      display: block;
    }
    .thinking .dots i:nth-child(2) { animation-delay: 0.2s; }
    .thinking .dots i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }

    /* Bottom-wrap: state + debug onder elkaar */
    .bottom-wrap {
      display: flex;
      flex-direction: column;
      gap: 1.4vmin;
    }

    /* Onderin: state label */
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 2vmin;
      letter-spacing: 0.2em;
      text-transform: lowercase;
      opacity: 0.5;
      font-weight: 300;
    }

    /* Debug-balk: wat de bot NU aan het doen is, voor Jolanda tijdens bouw */
    .debug {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 1.5vmin;
      line-height: 1.6;
      color: rgba(255,255,255,0.42);
      max-height: 10vmin;
      overflow: hidden;
      padding: 1vmin 1.4vmin;
      background: rgba(0,0,0,0.35);
      border-left: 1px solid rgba(255,255,255,0.12);
      border-radius: 0 4px 4px 0;
    }
    .debug .line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .debug .ts { opacity: 0.5; margin-right: 0.8vmin; }
    .debug .wake      { color: #a8d8bf; }
    .debug .visitor   { color: rgba(255,255,255,0.75); }
    .debug .think_end { color: #f4b860; }
    .debug .speak     { color: #faf3ea; }
    .debug .photo     { color: #f4a060; }
    .debug .state     { color: rgba(168,216,191,0.7); }
    .debug .error     { color: #e07070; }
    .debug .skip      { color: rgba(255,255,255,0.35); font-style: italic; }
    .debug .sleep     { color: rgba(180,180,180,0.5); }
    .debug .boot, .debug .init { color: rgba(244,160,96,0.75); }
    .state-label .dot {
      display: inline-block;
      width: 1.1vmin; height: 1.1vmin;
      border-radius: 50%;
      background: currentColor;
      margin-right: 1vmin;
      vertical-align: middle;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

    .state-sluimert { color: rgba(255,255,255,0.4); }
    .state-luistert { color: #a8d8bf; }
    .state-denkt    { color: #f4b860; }
    .state-spreekt  { color: #f4a060; }
    .state-offline  { color: #e07070; }

    .brand {
      font-family: Georgia, serif;
      font-style: italic;
      opacity: 0.4;
      letter-spacing: 0;
      text-transform: none;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="square">
      <img id="cam" class="absent" src="" alt="">
      <div class="overlay">
        <div class="top" id="top-info"><span class="brand">anna nova</span></div>

        <div class="conversation" id="conversation">
          <div class="line visitor" id="l-visitor">
            <span class="who">bezoeker</span>
            <span class="text" id="t-visitor"></span>
          </div>
          <div class="line anna" id="l-anna">
            <span class="who">anna</span>
            <span class="text" id="t-anna"></span>
          </div>
          <div class="thinking" id="thinking">
            <span>denkt</span>
            <span class="dots"><i></i><i></i><i></i></span>
          </div>
        </div>

        <div class="bottom-wrap">
          <div class="bottom">
            <span class="state-label state-sluimert" id="state-badge">
              <span class="dot"></span><span id="state-text">sluimert</span>
            </span>
            <span id="hint">zeg "hoi anna nova"</span>
          </div>
          <div class="debug" id="debug-bar" aria-label="debug log">
            <div class="line boot"><span class="ts">--:--:--</span>wacht op signaal...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const STATES = ["sluimert", "luistert", "denkt", "spreekt", "offline"];

  // --- camera-frame refresh ---
  const cam = document.getElementById("cam");
  let frameTimer = null;
  function refreshFrame() {
    const url = "/frame.jpg?t=" + Date.now();
    const img = new Image();
    img.onload = () => {
      cam.src = url;
      cam.classList.remove("absent");
    };
    img.onerror = () => {
      cam.classList.add("absent");
    };
    img.src = url;
  }
  refreshFrame();
  // 1 fps op het camerabeeld: Anna's ogen zijn traag, en meer kost CPU
  frameTimer = setInterval(refreshFrame, 1000);

  // --- state + conversation refresh ---
  let lastVisitor = "", lastAnna = "";
  function setLine(el, textEl, visibleEl, newText) {
    if (!newText) { el.classList.remove("visible"); textEl.textContent = ""; return; }
    textEl.textContent = newText;
    requestAnimationFrame(() => el.classList.add("visible"));
  }

  async function tick() {
    try {
      // Eén gecombineerde fetch i.p.v. drie losse: scheelt ~2/3 HTTP overhead
      const r = await fetch("/tick", { cache: "no-store" });
      const j = await r.json();
      const state = j.state;
      const messages = j.messages || [];
      const debugItems = j.debug || [];

      // State badge
      const badge = document.getElementById("state-badge");
      const stateText = document.getElementById("state-text");
      const s = STATES.includes(state) ? state : "sluimert";
      STATES.forEach(x => badge.classList.remove("state-" + x));
      badge.classList.add("state-" + s);
      stateText.textContent = s;

      // Hint rechtsonder: wissel per staat
      const hint = document.getElementById("hint");
      hint.textContent = {
        sluimert: 'zeg "hoi anna nova"',
        luistert: "ze luistert",
        denkt:    "",
        spreekt:  "",
        offline:  "verbinding verbroken"
      }[s] || "";

      // Denk-indicator
      document.getElementById("thinking").classList.toggle("on", s === "denkt");

      // Laatste visitor + laatste anna uit messages halen (behalve bij denken,
      // dan tonen we visitor + lege anna + puntjes)
      let v = "", a = "";
      for (const m of messages) {
        if (m.kind === "visitor") v = m.text;
        else if (m.kind === "anna") a = m.text;
      }
      if (s === "denkt") a = "";  // puntjes vervangen de anna-zin

      if (v !== lastVisitor) {
        lastVisitor = v;
        setLine(document.getElementById("l-visitor"),
                document.getElementById("t-visitor"), null, v);
      }
      if (a !== lastAnna) {
        lastAnna = a;
        setLine(document.getElementById("l-anna"),
                document.getElementById("t-anna"), null, a);
      }

      // Debug-balk hergebruikt dezelfde fetch
      if (debugItems.length) {
        const last = debugItems[debugItems.length-1];
        const key = last.ts + "|" + last.msg;
        if (key !== lastDebugTs) {
          lastDebugTs = key;
          const bar = document.getElementById("debug-bar");
          bar.innerHTML = debugItems.slice(-4).map(e =>
            `<div class="line ${e.kind}"><span class="ts">${e.ts}</span>${escapeHtml(e.msg)}</div>`
          ).join("");
        }
      }

    } catch (e) {
      const badge = document.getElementById("state-badge");
      STATES.forEach(x => badge.classList.remove("state-" + x));
      badge.classList.add("state-offline");
      document.getElementById("state-text").textContent = "offline";
    }
  }
  let lastDebugTs = "";
  function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
  tick();
  // Eén gecombineerde cyclus — state+messages+debug tegelijk
  setInterval(tick, 1000);
</script>
</body>
</html>
