<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anna Nova</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      cursor: none;
    }

    .stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .square {
      position: relative;
      width: 100vmin; height: 100vmin;
      overflow: hidden;
      background: #000;
    }

    /* Camerabeeld — scherp genoeg om door te schijnen, iets donkerder */
    #cam {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: blur(2px) brightness(0.75) saturate(1.05);
      transform: scale(1.04);
      transition: filter 1s ease, opacity 0.6s ease;
    }
    #cam.absent { opacity: 0.55; filter: blur(14px) brightness(0.55); }

    /* Vignette: donker-rode hoeken, midden blijft transparant zodat het
       gezicht in de camera doorschijnt. Zit BOVEN de cam, ONDER de vonken. */
    .vignette {
      position: absolute; inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 60% at 50% 50%,
          rgba(0,0,0,0) 0%,
          rgba(0,0,0,0) 35%,
          rgba(74,10,22,0.55) 65%,
          rgba(43,4,16,0.9) 85%,
          rgba(20,2,8,1) 100%);
    }

    /* Vonken-laag: transparante svg BOVEN de cam, laat gezicht doorschijnen */
    .fx {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Tekst-laag in het midden */
    .center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 8vmin;
      z-index: 3;
      text-align: center;
      text-shadow: 0 2px 20px rgba(0,0,0,0.95), 0 0 32px rgba(0,0,0,0.85), 0 0 4px rgba(0,0,0,0.9);
      pointer-events: none;
    }
    .line {
      line-height: 1.22;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      max-width: 100%;
      margin: 1.2vmin 0;
    }
    .line.visible { opacity: 1; transform: translateY(0); }
    .line .who {
      display: block;
      font-size: 2.6vmin;
      letter-spacing: 0.22em;
      text-transform: lowercase;
      opacity: 0.75;
      margin-bottom: 1vmin;
      font-weight: 500;
      font-family: ui-monospace, Menlo, monospace;
    }
    .line .text {
      display: block;
      font-size: 8.5vmin;
      font-weight: 500;
      line-height: 1.18;
      font-family: Georgia, serif;
    }
    .line.visitor .who  { color: #fff5ea; }
    .line.visitor .text { color: #fff5ea; font-style: normal; font-weight: 400; }
    .line.anna    .who  { color: #f4b860; }
    .line.anna    .text { color: #fdeecf; font-style: italic; }

    /* Denken: drie kleine deeltjes die rond het midden draaien (toegevoegd aan fx) */
    /* Spreken: puls in de center-box */
    body.state-spreekt .center { animation: breathe 1.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }

    /* Status-balk onderin: smal, strak, monospace */
    .status {
      position: absolute; left: 0; right: 0; bottom: 0;
      z-index: 4;
      display: flex; gap: 2vmin; align-items: center;
      padding: 1.2vmin 2vmin;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 1.8vmin;
      color: rgba(255,255,255,0.85);
      background: linear-gradient(0deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
      pointer-events: none;
      letter-spacing: 0.05em;
    }
    .status .dot {
      width: 1vmin; height: 1vmin; border-radius: 50%;
      background: currentColor;
      animation: pulse 1.8s ease-in-out infinite;
      flex: 0 0 auto;
    }
    .status .state-chip {
      display: inline-flex; align-items: center; gap: 1vmin;
      text-transform: uppercase; font-weight: 500;
    }
    .status .sep { opacity: 0.35; }
    .status .action { color: #f4b860; font-weight: 500; }
    .status .heard { opacity: 0.6; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45vmin; }
    .status .meta  { opacity: 0.55; margin-left: auto; }
    @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

    .s-sluimert { color: #d0cfc9; }
    .s-luistert { color: #a8d8bf; }
    .s-denkt    { color: #f4b860; }
    .s-spreekt  { color: #f4a060; }
    .s-offline  { color: #e07070; }

    /* Vonken gebruik CSS zodat we per state pause/boost kunnen */
    .spark {
      transform-origin: center;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    @keyframes rise { 0% { transform: translateY(0) scale(1); opacity: 0; }
                      10% { opacity: 1; }
                      100% { transform: translateY(-85vmin) scale(0.4); opacity: 0; } }
    @keyframes orbit {
      0%   { transform: rotate(0deg)   translateX(22vmin) rotate(0deg); opacity: 1; }
      100% { transform: rotate(360deg) translateX(22vmin) rotate(-360deg); opacity: 1; }
    }
    .spark { animation-name: rise; }

    body.state-luistert .spark { animation-play-state: paused; }
    body.state-denkt .spark {
      animation-name: orbit;
      animation-duration: 6s !important;
      transform-origin: 50vmin 50vmin !important;
    }
    body.state-spreekt .spark { animation-duration: 1.8s !important; }
  </style>
</head>
<body class="state-sluimert">
  <div class="stage">
    <div class="square">
      <img id="cam" src="/backdrop.webp" alt="">
      <div class="vignette"></div>

      <svg class="fx" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <g id="sparks"></g>
      </svg>

      <div class="center">
        <div class="line visitor" id="l-visitor">
          <span class="who" id="w-visitor">bezoeker</span>
          <span class="text" id="t-visitor"></span>
        </div>
        <div class="line anna" id="l-anna">
          <span class="who" id="w-anna">anna</span>
          <span class="text" id="t-anna"></span>
        </div>
      </div>

      <div class="status">
        <span class="state-chip s-sluimert" id="chip">
          <span class="dot"></span><span id="chip-text">sluimert</span>
        </span>
        <span class="sep">·</span>
        <span class="action" id="action">—</span>
        <span class="sep">·</span>
        <span class="heard" id="heard"></span>
        <span class="meta" id="meta-right">mistral</span>
      </div>
    </div>
  </div>

<script>
  const STATES = ["sluimert", "luistert", "denkt", "spreekt", "offline"];

  // --- vonken genereren: 28 stuks met variatie in startX, delay en duration ---
  (function makeSparks() {
    const g = document.getElementById("sparks");
    const parts = [];
    const colors = ["#f4b860", "#ff6a92", "#f08bb0", "#f4b860", "#fdeecf"];
    for (let i = 0; i < 28; i++) {
      const x = 4 + Math.random() * 92;
      const dur = 3 + Math.random() * 3.5;
      const delay = -Math.random() * dur;
      const r = 0.25 + Math.random() * 0.45;
      const col = colors[i % colors.length];
      parts.push(
        `<circle class="spark" cx="${x.toFixed(1)}" cy="95" r="${r.toFixed(2)}" fill="${col}" ` +
        `style="animation-duration:${dur.toFixed(2)}s;animation-delay:${delay.toFixed(2)}s" />`
      );
    }
    g.innerHTML = parts.join("");
  })();

  // --- camerabeeld refresh ---
  const cam = document.getElementById("cam");
  function refreshFrame() {
    const url = "/frame.jpg?t=" + Date.now();
    const img = new Image();
    img.onload = () => { cam.src = url; cam.classList.remove("absent"); };
    img.onerror = () => { cam.src = "/backdrop.webp"; cam.classList.add("absent"); };
    img.src = url;
  }
  refreshFrame();
  setInterval(refreshFrame, 1000);

  // --- helpers ---
  let lastVisitor = "", lastAnna = "", lastDebugTs = "";
  function setLine(lineEl, textEl, newText) {
    if (!newText) { lineEl.classList.remove("visible"); textEl.textContent = ""; return; }
    textEl.textContent = newText;
    requestAnimationFrame(() => lineEl.classList.add("visible"));
  }

  async function tick() {
    try {
      const r = await fetch("/tick", { cache: "no-store" });
      const j = await r.json();
      const state = STATES.includes(j.state) ? j.state : "sluimert";
      const messages = j.messages || [];
      const debugItems = j.debug || [];

      // Body class voor state-afhankelijke animatie
      STATES.forEach(x => document.body.classList.remove("state-" + x));
      document.body.classList.add("state-" + state);

      // State chip
      const chip = document.getElementById("chip");
      STATES.forEach(x => chip.classList.remove("s-" + x));
      chip.classList.add("s-" + state);
      document.getElementById("chip-text").textContent = state;

      // Laatste visitor + laatste anna
      let v = "", a = "";
      for (const m of messages) {
        if (m.kind === "visitor") v = m.text;
        else if (m.kind === "anna") a = m.text;
      }
      if (state === "denkt") a = "";

      if (v !== lastVisitor) {
        lastVisitor = v;
        setLine(document.getElementById("l-visitor"),
                document.getElementById("t-visitor"), v);
      }
      if (a !== lastAnna) {
        lastAnna = a;
        setLine(document.getElementById("l-anna"),
                document.getElementById("t-anna"), a);
      }

      // Status-balk: "action" = wat Anna NU doet (state-kind debug events)
      //              "heard" = laatste gehoorde zin (skip/wake/visitor)
      let heard = "", action = "";
      if (debugItems.length) {
        // Zoek laatste "state" kind event (= substatus: transcribeert, denkt met …, etc)
        for (let i = debugItems.length - 1; i >= Math.max(0, debugItems.length - 12); i--) {
          const e = debugItems[i];
          if (e.kind === "state" && !e.msg.startsWith("staat →")) {
            action = e.msg;
            break;
          }
        }
        // Fallback: als geen state-action, toon de hoofdstaat zelf
        if (!action) {
          action = {
            sluimert: "wacht op wake",
            luistert: "neemt op…",
            denkt:    "denkt…",
            spreekt:  "spreekt…",
            offline:  "offline"
          }[state] || "";
        }
        // Laatste wat ze hoorde
        for (let i = debugItems.length - 1; i >= Math.max(0, debugItems.length - 12); i--) {
          const e = debugItems[i];
          if (e.kind === "skip" || e.kind === "wake" || e.kind === "visitor") {
            const m = e.msg.replace(/^genegeerd \(geen wake\): /, "")
                           .replace(/^wake: /, "")
                           .replace(/^visitor: /, "");
            heard = "gehoord " + m;
            break;
          }
        }
      }
      document.getElementById("action").textContent = action;
      document.getElementById("heard").textContent = heard;

    } catch (e) {
      STATES.forEach(x => document.body.classList.remove("state-" + x));
      document.body.classList.add("state-offline");
      const chip = document.getElementById("chip");
      STATES.forEach(x => chip.classList.remove("s-" + x));
      chip.classList.add("s-offline");
      document.getElementById("chip-text").textContent = "offline";
    }
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
