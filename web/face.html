<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anna Nova 💫</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 0 1em; color: #333; }
    h2 { color: #333; font-weight: normal; }
    #chatbox {
      border: 1px solid #ccc;
      padding: 1em;
      height: 400px;
      overflow-y: auto;
      background: #f9f9f9;
      margin-bottom: 10px;
      border-radius: 4px;
    }
    #chatbox p { margin: 0.4em 0; line-height: 1.5; }
    #chatbox strong { color: #666; }
    .msg-anna strong { color: #c67e3e; }
    .msg-anna {
      background: #fdf7ec;
      padding: 0.5em 0.8em;
      border-radius: 6px;
      margin: 0.6em 0 !important;
    }
    .empty { color: #aaa; text-align: center; margin-top: 3em; font-style: italic; }
    #state {
      font-size: 0.9em;
      color: #888;
      font-style: italic;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 1; }
    }
    .state-sluimert { color: #999; }
    .state-luistert { color: #2a7a52; }
    .state-denkt    { color: #c67e3e; }
    .state-spreekt  { color: #d85a30; font-weight: 500; }
    .state-offline  { color: #c33; }
  </style>
</head>
<body>
  <h2>Chat met Anna Nova 💫</h2>
  <div id="chatbox"><p class="empty">(nog niets gezegd)</p></div>
  <div id="state" class="state-sluimert">
    <span class="pulse-dot"></span><span id="state-text">sluimert</span>
  </div>

<script>
  const STATES = ["sluimert", "luistert", "denkt", "spreekt", "offline"];
  let lastCount = -1;

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  async function tick() {
    try {
      const [sr, mr] = await Promise.all([
        fetch("/state",    { cache: "no-store" }),
        fetch("/messages", { cache: "no-store" })
      ]);
      const state = (await sr.json()).state;
      const messages = await mr.json();

      const stateEl = document.getElementById("state");
      const stateTxt = document.getElementById("state-text");
      const s = STATES.includes(state) ? state : "sluimert";
      STATES.forEach(x => stateEl.classList.remove("state-" + x));
      stateEl.classList.add("state-" + s);
      stateTxt.textContent = s;

      if (messages.length !== lastCount) {
        lastCount = messages.length;
        const box = document.getElementById("chatbox");
        if (messages.length === 0) {
          box.innerHTML = '<p class="empty">(nog niets gezegd)</p>';
        } else {
          box.innerHTML = messages.map(m => {
            const sender = m.kind === "anna" ? "Anna Nova" : "Jij";
            const cls = m.kind === "anna" ? "msg-anna" : "";
            return `<p class="${cls}"><strong>${sender}:</strong> ${escapeHtml(m.text)}</p>`;
          }).join("");
          box.scrollTop = box.scrollHeight;
        }
      }
    } catch (e) {
      const stateEl = document.getElementById("state");
      STATES.forEach(x => stateEl.classList.remove("state-" + x));
      stateEl.classList.add("state-offline");
      document.getElementById("state-text").textContent = "offline";
    }
  }

  tick();
  setInterval(tick, 1200);
</script>
</body>
</html>
